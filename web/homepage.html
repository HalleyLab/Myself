    <script src="https://unpkg.com/typed.js@2.0.132/dist/typed.umd.js"></script>
    <script>
      var typed = new Typed(".multiple-text", {
      strings: ['欢迎使用这个网页', "有任何问题欢迎联系"],
      typeSpeed: 100,
      backSpeed: 100,
      backDelay: 1000,
      loop: true
})

$(window).load(function(){
	$('#loading').css('transform','scale(1.4)');
	$('#loading').fadeOut('slow', function(){
		$('section').removeClass('in');
	});
});

	
$(document).ready(function(){
	//MENU
    $('.btnMenu').click(function(){
        var clase = $(this).attr('class');
		if(clase == 'btnMenu'){
			$(this).addClass('open');
			$('nav').fadeIn('fast');
			var elem = $('nav .botonera')
			centrarV(elem);	
		}else{
			$(this).removeClass('open');
			$('nav').fadeOut('fast');	
		}
    });
	//BLUR
	$('.botonera li').hover(
         function () {
			$('.botonera li').addClass('blur');
            $(this).removeClass('blur');
         }, 
         function () {
			$('.botonera li').removeClass('blur');
         }
     );
	//INICIO
	var ex = $('.centered').length;
	for(var i=0; i < ex; i++){
		var elem = $('.centered:eq('+i+')');
		centrarV(elem);		
	}
	function resize(){
	  for(var i=0; i < ex; i++){
		var elem = $('.centered:eq('+i+')');
		centrarV(elem);		
	  }	
	}
	var Resize;
	$(window).resize(function() {
		clearTimeout(Resize);	
		Resize = setTimeout(resize, 200);	
	});
	
	//ANCLAS
	$('a.arrowDown').click(function(e){
		e.preventDefault();
		enlace  = $(this).attr('href');
		$('html, body').animate({
			scrollTop: $(enlace).offset().top
		}, 300, 'easeOutCirc');
	});
	//ANCLAS PROYECTOS
	$('#casos .headCasos .arrowIr').click(function(e){
		e.preventDefault();
		enlace  = '.imgPrincipal';
		$('html, body').animate({
			scrollTop: $(enlace).offset().top
		}, 1200, 'easeOutCirc');
	});
	$('#inicio, #slide1, #slide2').click(function(e){
		enlace  = $(this).attr('data-rel');
		$('html, body').animate({
			scrollTop: $(enlace).offset().top
		}, 300, 'easeOutCirc');
	});

	if($(window).width() <= 480){
		$('.legal').html('<strong>Estudio NK</strong>Diseñando con pasión desde el 2006');
	}
});
    </script>
